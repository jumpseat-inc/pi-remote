name: gates

on:
  push:
  pull_request:

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck once a tsconfig exists (always does since scaffold).
      - name: Typecheck
        if: hashFiles('tsconfig.json') != ''
        run: bunx tsc --noEmit

      # Test only when test files exist, so the gate stays green while the
      # repo has no code and tightens automatically as cards land tests.
      - name: Test
        if: hashFiles('**/*.test.ts', '**/*.test.tsx') != ''
        run: bun test
